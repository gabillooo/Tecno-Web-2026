<header class="site-header">
  <a class="brand" routerLink="/admin">
    Municipalidad de New York
    <small>ADMINISTRACIÓN DE PERMISOS</small>
  </a>
  <nav>
    <a routerLink="/admin" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Inicio</a>
    <a routerLink="/admin/solicitudes" routerLinkActive="activo">Solicitudes</a>
    <a routerLink="/admin/catalogo" routerLinkActive="activo">Catálogo</a>
    <a routerLink="/admin/estadisticas" routerLinkActive="activo">Estadísticas</a>
  </nav>
  <button type="button" class="link-button" *ngIf="auth.usuario$ | async as usuario" (click)="salir()">
    Salir · {{ usuario.nombre }}
  </button>
</header>

<main class="page-shell">
  <router-outlet></router-outlet>
</main>

<footer class="site-footer">
  Panel administrativo
</footer>
