<section class="login tarjeta">
  <div class="tarjeta__cuerpo">
    <h1>Administración de permisos</h1>
    <p class="texto-suave intro">Acceso de demostración para personal municipal.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="campo-grupo">
        <label class="etiqueta" for="email">Correo electrónico</label>
        <input
          id="email"
          class="campo"
          type="email"
          formControlName="email"
          autocomplete="username"
          [class.campo--error]="form.controls.email.touched && form.controls.email.invalid"
          [attr.aria-invalid]="form.controls.email.touched && form.controls.email.invalid"
        />
        <p class="campo-error" *ngIf="form.controls.email.touched && form.controls.email.errors?.['required']">
          ✕ Ingresa tu correo electrónico.
        </p>
        <p class="campo-error" *ngIf="form.controls.email.touched && form.controls.email.errors?.['email']">
          ✕ Ingresa un correo válido, por ejemplo nombre@dominio.cl
        </p>
      </div>

      <div class="campo-grupo">
        <label class="etiqueta" for="password">Contraseña</label>
        <input
          id="password"
          class="campo"
          type="password"
          formControlName="password"
          autocomplete="current-password"
          [class.campo--error]="form.controls.password.touched && form.controls.password.invalid"
          [attr.aria-invalid]="form.controls.password.touched && form.controls.password.invalid"
        />
        <p class="campo-error" *ngIf="form.controls.password.touched && form.controls.password.errors?.['required']">
          ✕ Ingresa tu contraseña.
        </p>
      </div>

      <div class="alerta alerta--error" role="alert" *ngIf="errorMensaje">{{ errorMensaje }}</div>

      <button type="submit" class="boton boton--bloque" [class.boton--cargando]="cargando" [disabled]="cargando">
        <span class="girador" *ngIf="cargando" aria-hidden="true"></span>
        {{ cargando ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>
  </div>
</section>
